server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Product calls stay inside the Container Apps environment and bypass Exchange.
    # 中文：产品请求在容器应用环境内直达各服务，不经 Exchange 中转。
    location ^~ /api/v1/catalyst/ {
        proxy_pass http://cyrene-catalyst/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/echo/ {
        proxy_pass http://cyrene-echo/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/reactor/api/v1/ {
        proxy_pass http://cyrene-reactor/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/reactor/ {
        proxy_pass http://cyrene-reactor/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/yield/api/v1/ {
        proxy_pass http://cyrene-yield/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/yield/ {
        proxy_pass http://cyrene-yield/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location /api/ {
        proxy_pass http://cyrene-exchange/api/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    # The public Web edge forwards Exchange's own API-key gateway internally.
    # 中文：公网 Web 入口将 Exchange 自有的 API Key 网关请求转到内部服务。
    location ^~ /v1/ {
        proxy_pass http://cyrene-exchange/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
