server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Product calls stay inside the Container Apps environment and bypass Exchange.
    # 中文：产品请求在容器应用环境内直达各服务，不经 Exchange 中转。
    location ^~ /api/v1/catalyst/ {
        proxy_pass http://cyrene-catalyst/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/echo/ {
        proxy_pass http://cyrene-echo/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/reactor/api/v1/ {
        proxy_pass http://cyrene-reactor/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/reactor/ {
        proxy_pass http://cyrene-reactor/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/yield/api/v1/ {
        proxy_pass http://cyrene-yield/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location ^~ /api/v1/yield/ {
        proxy_pass http://cyrene-yield/api/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    # Keep Workspace calls same-origin. The exact prefix wins over /api/ and
    # stays unavailable until ACA Easy Auth, token scope, and the BFF are ready.
    # 中文：Workspace 请求保持同源；该精确路由优先于 /api/，在身份令牌与 BFF 配置完成前保持关闭。
    location = /api/workspace/v1 {
        default_type application/json;
        return 404 '{"error":"workspace_bff_route_not_found"}';
    }

    location ^~ /api/workspace/v1/ {
        default_type application/json;

        set $workspace_bff_enabled "${CYRENE_WORKSPACE_BFF_ENABLED}";
        if ($workspace_bff_enabled != "true") {
            return 503 '{"error":"workspace_bff_unavailable"}';
        }

        set $workspace_bff_upstream "${CYRENE_WORKSPACE_BFF_UPSTREAM}";
        if ($workspace_bff_upstream = "") {
            return 503 '{"error":"workspace_bff_unavailable"}';
        }
        if ($http_x_ms_token_aad_access_token = "") {
            return 401 '{"error":"workspace_bff_access_token_required"}';
        }

        # Resolve the future ACA name on request, not while Nginx starts.
        # 中文：在请求时解析未来的 ACA 服务名，避免 Nginx 启动时依赖目标 DNS。
        resolver ${CYRENE_WORKSPACE_BFF_DNS_RESOLVER} valid=30s ipv6=off;
        proxy_pass https://$workspace_bff_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $workspace_bff_upstream;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_http_version 1.1;
        proxy_set_header Host $workspace_bff_upstream;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Use only Easy Auth's access-token header as a bearer credential.
        # 中文：只将 Easy Auth 注入的 access token 用作 bearer 凭据。
        proxy_set_header Authorization "Bearer $http_x_ms_token_aad_access_token";
        proxy_set_header X-MS-TOKEN-AAD-ACCESS-TOKEN "";
        proxy_set_header X-MS-TOKEN-AAD-ID-TOKEN "";
        proxy_set_header X-MS-TOKEN-AAD-REFRESH-TOKEN "";
        proxy_set_header X-MS-TOKEN-AAD-EXPIRES-ON "";

        # The BFF must validate the bearer token; never forward principal headers.
        # 中文：BFF 必须验证 bearer token；不转发 principal 身份头。
        proxy_set_header X-MS-CLIENT-PRINCIPAL "";
        proxy_set_header X-MS-CLIENT-PRINCIPAL-ID "";
        proxy_set_header X-MS-CLIENT-PRINCIPAL-NAME "";
        proxy_set_header X-MS-CLIENT-PRINCIPAL-IDP "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://cyrene-exchange/api/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    # The public Web edge forwards Exchange's own API-key gateway internally.
    # 中文：公网 Web 入口将 Exchange 自有的 API Key 网关请求转到内部服务。
    location ^~ /v1/ {
        proxy_pass http://cyrene-exchange/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
