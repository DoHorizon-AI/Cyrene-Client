server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    client_max_body_size 32m;
    # Browser traffic shares Studio authorization and the explicit Product allowlist.
    location ~ ^/(studio-|api) {
        proxy_pass ${STUDIO_CONTROL_ORIGIN};
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The public Web edge forwards Exchange's own API-key gateway internally.
    # 中文：公网 Web 入口将 Exchange 自有的 API Key 网关请求转到内部服务。
    location ^~ /v1/ {
        proxy_pass http://cyrene-exchange/v1/;
        include /etc/nginx/cyrene-proxy.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
