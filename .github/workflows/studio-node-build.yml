name: Studio node image
run-name: studio-build:${{ inputs.studio_build_id }}
on:
  workflow_dispatch:
    inputs:
      studio_build_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      profile_id:
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: studio-build-${{ inputs.studio_build_id }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STUDIO_BUILD_ID: ${{ inputs.studio_build_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PROFILE_ID: ${{ inputs.profile_id }}
      SOURCE_DIRECTORY: ${{ github.workspace }}/source
    steps:
      - name: Initialize runner-local output paths
        run: |
          printf 'IMAGE_METADATA=%s/image-metadata.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'BUILD_RESULT_FILE=%s/build-result.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate approved build inputs
        id: prepare
        run: node trusted/scripts/node-build.mjs prepare
      - name: Authenticate registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and publish fixed source
        env:
          BUILD_CONTEXT: ${{ steps.prepare.outputs.context }}
          BUILD_DOCKERFILE: ${{ steps.prepare.outputs.dockerfile }}
          IMAGE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          docker buildx create --name studio-builder --driver docker-container --use
          docker buildx build --push --provenance=true --metadata-file "$IMAGE_METADATA" --tag "$IMAGE_TAG" --file "$BUILD_DOCKERFILE" "$BUILD_CONTEXT"
      - name: Produce correlated result
        run: node trusted/scripts/node-build.mjs result
      - uses: actions/upload-artifact@v4
        with:
          name: studio-result-${{ inputs.studio_build_id }}
          path: ${{ runner.temp }}/build-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
