name: Studio CI

on:
  push:
    branches: [develop, main, release]
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: studio-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_test -d studio_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      STUDIO_TEST_DATABASE_URL: postgresql://studio_test:studio-ci-test-only@127.0.0.1:5432/studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
