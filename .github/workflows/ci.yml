name: Client CI

on:
  push:
    branches: [develop, main, release, 'feat/**', 'fix/**']
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Build Web Host image
        run: docker build --tag cyrene-client-web:ci .
      - name: Validate Web Host routing configuration
        run: |
          docker run --rm \
            --add-host cyrene-catalyst:127.0.0.1 \
            --add-host cyrene-echo:127.0.0.1 \
            --add-host cyrene-reactor:127.0.0.1 \
            --add-host cyrene-yield:127.0.0.1 \
            --add-host cyrene-exchange:127.0.0.1 \
            cyrene-client-web:ci nginx -t
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
