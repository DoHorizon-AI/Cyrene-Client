name: Client CI

on:
  push:
    branches: [develop, main, release, 'feat/**', 'fix/**']
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: studio-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_test -d studio_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      STUDIO_TEST_DATABASE_URL: postgresql://studio_test:studio-ci-test-only@127.0.0.1:5432/studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check out pinned Navigator Web Host source for the Exchange loopback
        uses: actions/checkout@v4
        with:
          repository: DoHorizon-AI/Cyrene-Navigator
          ref: e90288c8a4ecbcb3711d554366e7ac5227e62397
          path: .test-deps/navigator
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .test-deps/navigator/pyproject.toml
      - name: Install pinned Navigator Web Host dependencies
        working-directory: .test-deps/navigator
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run Client tests including the pinned Exchange HTTP loopback
        run: npm run check
        env:
          CYRENE_NAVIGATOR_ROOT: ${{ github.workspace }}/.test-deps/navigator
          CYRENE_NAVIGATOR_PYTHON: python
      - name: Build the standalone Workspace Web root
        run: npm run build:workspace-web
      - name: Build Studio web and control images
        run: |
          docker build -f deploy/studio.Dockerfile --target web --tag cyrene-studio:web-development .
          docker build -f deploy/studio.Dockerfile --target control --tag cyrene-studio:control-development .
      - run: npm run test:containers
      - name: Build unified Client image
        run: docker build --tag cyrene-client-web:ci .
      - name: Build Workspace web image
        run: docker build -f Dockerfile.workspace-web --tag cyrene-client-workspace-web:ci .
      - name: Verify Workspace BFF boundary
        run: sh tooling/check-workspace-bff-routing.sh cyrene-client-web:ci
      - name: Validate unified Client routing configuration
        run: |
          docker run --rm \
            --add-host studio-control:127.0.0.1 \
            --add-host cyrene-catalyst:127.0.0.1 \
            --add-host cyrene-echo:127.0.0.1 \
            --add-host cyrene-reactor:127.0.0.1 \
            --add-host cyrene-yield:127.0.0.1 \
            --add-host cyrene-exchange:127.0.0.1 \
            cyrene-client-web:ci nginx -t
      - name: Check Workspace BFF default-off and incomplete routes
        run: sh tooling/check-workspace-bff-routing.sh
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
