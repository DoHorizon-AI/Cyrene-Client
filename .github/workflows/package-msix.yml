name: package-msix

on:
  push:
    branches: [develop, main, release, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-package-msix:
    name: windows / build & package msix installer
    runs-on: windows-2025
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Cyrene-Client
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1-x86_64-pc-windows-msvc

      - name: Build Native Host & Installer
        working-directory: apps/win
        env:
          CYRENE_DEFAULT_EXCHANGE_URL: ${{ secrets.CYRENE_EXCHANGE_URL || vars.CYRENE_EXCHANGE_URL || '' }}
        run: |
          cargo build --release --workspace

      - name: Verify compiled binaries
        run: |
          $installer = "apps/win/target/release/installer.exe"
          if (-not (Test-Path $installer)) { throw "installer.exe was not built" }
          # cyrene-native-host.exe is built by the Cyrene-Navigator repository.
          Write-Host "Found compiled binary: $installer"

      - name: Package & Sign MSIX Installer
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File apps/win/installer/package-msix.ps1 `
            -LayoutDir "dist/msix-layout" `
            -OutputMsix "dist/installer.msix"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-installer
          path: |
            dist/installer.msix
            dist/installer.exe
            dist/cyrene-dev-cert.pfx
          if-no-files-found: error
          retention-days: 14
