name: Immutable Workspace Studio Control release

on:
  push:
    branches: [develop, main, release]
  workflow_dispatch:
    inputs:
      schema_sha:
        description: Exact merged Workspace authority commit used for schemas and Catalog v2
        required: false
        type: string
        default: "18455255cdf8b87dd8cd48ceb25e5ea411a622ad"

permissions:
  contents: read

concurrency:
  group: workspace-control-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish attested native Studio Control
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: DoHorizon-AI/Cyrene-Client
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      PREDICATE_TYPE: https://slsa.dev/provenance/v1
      WORKSPACE_SCHEMA_SHA: ${{ github.event.inputs.schema_sha || '18455255cdf8b87dd8cd48ceb25e5ea411a622ad' }}
      NODE_RUNTIME_VERSION: v24.21.0
      NODE_RUNTIME_SHA256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6

    steps:
      - name: Check out the exact integration-branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Define isolated workflow temp paths
        run: |
          set -euo pipefail
          echo "RELEASE_DIR=$RUNNER_TEMP/workspace-control-release" >> "$GITHUB_ENV"
          echo "BUNDLE_DIR=$RUNNER_TEMP/workspace-control-bundle" >> "$GITHUB_ENV"
          echo "SCHEMA_DIR=$RUNNER_TEMP/workspace-schema/governance" >> "$GITHUB_ENV"

      - name: Wait for successful Client CI on this exact pushed source
        run: |
          set -euo pipefail
          case "$SOURCE_REF" in
            refs/heads/develop) channel=preview ;;
            refs/heads/main|refs/heads/release) channel=stable ;;
            *) echo "unsupported release source ref: $SOURCE_REF" >&2; exit 2 ;;
          esac
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release source must be a full Git SHA-1" >&2
            exit 2
          }
          for attempt in $(seq 1 60); do
            runs=$(gh api --method GET "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$SOURCE_COMMIT" -f event=push -f per_page=100)
            if printf '%s' "$runs" | jq -e --arg sha "$SOURCE_COMMIT" '
              [.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .conclusion == "success")] | length > 0
            ' >/dev/null; then
              echo "Client CI succeeded for $SOURCE_REF@$SOURCE_COMMIT ($channel)"
              exit 0
            fi
            state=$(printf '%s' "$runs" | jq -r --arg sha "$SOURCE_COMMIT" '
              [.workflow_runs[] | select(.head_sha == $sha and .event == "push")] |
              if length == 0 then "missing" else (sort_by(.created_at) | last | .status + ":" + (.conclusion // "pending")) end
            ')
            case "$state" in
              completed:failure|completed:cancelled|completed:timed_out|completed:action_required)
                echo "Client CI did not pass for $SOURCE_COMMIT (state=$state)" >&2
                exit 1
                ;;
            esac
            echo "Waiting for exact-SHA Client CI ($attempt/60; state=$state)"
            sleep 30
          done
          echo "Client CI did not finish successfully within 30 minutes for $SOURCE_COMMIT" >&2
          exit 1

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build the standalone Control bundle and verify the embedded Node runtime
        run: |
          set -euo pipefail
          npm ci
          mkdir -p "$BUNDLE_DIR/bin" "$BUNDLE_DIR/lib" "$BUNDLE_DIR/runtime" "$BUNDLE_DIR/systemd"
          npx esbuild apps/control/main.ts \
            --bundle --packages=bundle --platform=node --target=node24 --format=esm \
            --legal-comments=none \
            --banner:js='import { createRequire as __cyreneCreateRequire } from "node:module"; const require = __cyreneCreateRequire(import.meta.url);' \
            --outfile="$BUNDLE_DIR/lib/studio-control.mjs"
          node_archive="$RUNNER_TEMP/node-$NODE_RUNTIME_VERSION-linux-x64.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://nodejs.org/dist/$NODE_RUNTIME_VERSION/node-$NODE_RUNTIME_VERSION-linux-x64.tar.xz" \
            --output "$node_archive"
          printf '%s  %s\n' "$NODE_RUNTIME_SHA256" "$node_archive" | sha256sum --check --status
          tar --extract --xz --file "$node_archive" --directory "$BUNDLE_DIR/runtime" --strip-components=1 \
            "node-$NODE_RUNTIME_VERSION-linux-x64/bin/node" \
            "node-$NODE_RUNTIME_VERSION-linux-x64/LICENSE"
          test "$("$BUNDLE_DIR/runtime/bin/node" --version)" = "$NODE_RUNTIME_VERSION"
          cat > "$BUNDLE_DIR/bin/cyrene-studio-control" <<'SH'
          #!/bin/sh
          set -eu
          BASE_DIR=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd -P)
          exec "$BASE_DIR/runtime/bin/node" "$BASE_DIR/lib/studio-control.mjs" "$@"
          SH
          chmod 0755 "$BUNDLE_DIR/bin/cyrene-studio-control"
          install -m 0644 deploy/systemd/cyrene-client-workspace-control.service \
            "$BUNDLE_DIR/systemd/cyrene-client-workspace-control.service"
          NODE_RUNTIME_VERSION="$NODE_RUNTIME_VERSION" NODE_RUNTIME_SHA256="$NODE_RUNTIME_SHA256" \
            node tooling/release/collect-control-licenses.mjs "$GITHUB_WORKSPACE" "$BUNDLE_DIR"
          mkdir -p "$RELEASE_DIR"
          echo "CHANNEL=$([[ "$SOURCE_REF" == refs/heads/develop ]] && echo preview || echo stable)" >> "$GITHUB_ENV"

      - name: Read the exact merged Workspace manifest and Catalog authority
        run: |
          set -euo pipefail
          [[ "$WORKSPACE_SCHEMA_SHA" =~ ^[0-9a-f]{40}$ && "$WORKSPACE_SCHEMA_SHA" != 0000000000000000000000000000000000000000 ]] || {
            echo "pin the merged Workspace authority SHA before publishing" >&2
            exit 2
          }
          git init "$RUNNER_TEMP/workspace-schema"
          git -C "$RUNNER_TEMP/workspace-schema" remote add origin https://github.com/DoHorizon-AI/Cyrene-Workspace.git
          git -C "$RUNNER_TEMP/workspace-schema" fetch --no-tags --depth=1 origin "$WORKSPACE_SCHEMA_SHA"
          git -C "$RUNNER_TEMP/workspace-schema" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/workspace-schema" rev-parse HEAD)" = "$WORKSPACE_SCHEMA_SHA"
          for name in component-release-manifest-v1.schema.json component-release-manifest-v2.schema.json component-release-index-v1.schema.json component-catalog-v2.schema.json component-catalog-v2.json; do
            test -f "$SCHEMA_DIR/$name"
          done
          echo "Using pinned Workspace schemas and Catalog v2 from $WORKSPACE_SCHEMA_SHA"

      - name: Build the immutable source-SHA release assets
        run: |
          set -euo pipefail
          node --import tsx tooling/release/native-control-component.ts \
            --bundle "$BUNDLE_DIR" \
            --output "$RELEASE_DIR" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --channel "$CHANNEL" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --generated-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Install the pinned JSON Schema validator
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'

      - name: Install the pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.26.0' 'referencing==0.37.0'

      - name: Validate manifest, index, native archive, Catalog identity and source
        run: |
          set -euo pipefail
          python tooling/release/validate_native_control_release.py \
            --directory "$RELEASE_DIR" \
            --schema-directory "$SCHEMA_DIR" \
            --catalog "$SCHEMA_DIR/component-catalog-v2.json" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT"

      - name: Verify and reuse an already published immutable source-SHA release
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$CHANNEL-cyrene-client-workspace-control-$SOURCE_COMMIT"
          if gh api "repos/$REPOSITORY/releases/tags/$release_tag" > "$RUNNER_TEMP/workspace-control-existing.json" 2> "$RUNNER_TEMP/workspace-control-existing.err"; then
            existing=true
          elif grep -Fq 'HTTP 404' "$RUNNER_TEMP/workspace-control-existing.err"; then
            existing=false
          else
            cat "$RUNNER_TEMP/workspace-control-existing.err" >&2
            exit 1
          fi
          if [[ "$existing" == false ]]; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - "$RUNNER_TEMP/workspace-control-existing.json" "$release_tag" <<'PY'
          import json
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if release.get("tag_name") != sys.argv[2]:
              raise SystemExit("existing source-SHA release has a different tag")
          if release.get("immutable") is not True:
              raise SystemExit("existing native-Control release is not immutable")
          PY
          tag=$(gh api "repos/$REPOSITORY/git/ref/tags/$release_tag")
          test "$(printf '%s' "$tag" | jq -r '.object.type')" = commit
          test "$(printf '%s' "$tag" | jq -r '.object.sha')" = "$SOURCE_COMMIT"
          mkdir -p "$RUNNER_TEMP/workspace-control-existing"
          gh release download "$release_tag" --repo "$REPOSITORY" --dir "$RUNNER_TEMP/workspace-control-existing"
          current_archive=$(find "$RELEASE_DIR" -maxdepth 1 -type f -name 'cyrene-client-workspace-control-*.tar.gz' -print -quit)
          published_archive=$(find "$RUNNER_TEMP/workspace-control-existing" -maxdepth 1 -type f -name 'cyrene-client-workspace-control-*.tar.gz' -print -quit)
          test -n "$current_archive" && test -n "$published_archive"
          cmp -- "$current_archive" "$published_archive"
          python tooling/release/validate_native_control_release.py \
            --directory "$RUNNER_TEMP/workspace-control-existing" \
            --schema-directory "$SCHEMA_DIR" \
            --catalog "$SCHEMA_DIR/component-catalog-v2.json" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT"
          for subject in \
            "$(basename "$published_archive")" \
            cyrene-client-workspace-control.manifest.json \
            component-release-index-v1.json; do
            gh attestation verify "$RUNNER_TEMP/workspace-control-existing/$subject" \
              --bundle "$RUNNER_TEMP/workspace-control-existing/$subject.attestation.jsonl" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/workspace-control-release.yml" \
              --source-ref "$SOURCE_REF" \
              --source-digest "$SOURCE_COMMIT" \
              --predicate-type "$PREDICATE_TYPE"
          done
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Create provenance attestations for archive, manifest and index
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          cd "$RELEASE_DIR"
          sha256sum \
            cyrene-client-workspace-control-"$SOURCE_COMMIT".tar.gz \
            cyrene-client-workspace-control.manifest.json \
            component-release-index-v1.json > "$RUNNER_TEMP/workspace-control-subjects.sha256"

      - name: Sign every immutable release subject
        if: steps.existing.outputs.published != 'true'
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/workspace-control-subjects.sha256

      - name: Download and verify detached attestations
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          cd "$RELEASE_DIR"
          for subject in \
            "cyrene-client-workspace-control-$SOURCE_COMMIT.tar.gz" \
            cyrene-client-workspace-control.manifest.json \
            component-release-index-v1.json; do
            digest="sha256:$(sha256sum "$subject" | cut -d ' ' -f 1)"
            gh attestation download "$RELEASE_DIR/$subject" --repo "$REPOSITORY" --predicate-type "$PREDICATE_TYPE"
            mv -- "$digest.jsonl" "$RELEASE_DIR/$subject.attestation.jsonl"
            gh attestation verify "$RELEASE_DIR/$subject" \
              --bundle "$RELEASE_DIR/$subject.attestation.jsonl" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/workspace-control-release.yml" \
              --source-ref "$SOURCE_REF" \
              --source-digest "$SOURCE_COMMIT" \
              --predicate-type "$PREDICATE_TYPE"
          done

      - name: Revalidate the complete attested release asset set
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          python tooling/release/validate_native_control_release.py \
            --directory "$RELEASE_DIR" \
            --schema-directory "$SCHEMA_DIR" \
            --catalog "$SCHEMA_DIR/component-catalog-v2.json" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT"

      - name: Pin the exact source SHA and publish the immutable release
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          release_tag="$CHANNEL-cyrene-client-workspace-control-$SOURCE_COMMIT"
          if tag=$(gh api "repos/$REPOSITORY/git/ref/tags/$release_tag" 2> "$RUNNER_TEMP/workspace-control-tag.err"); then
            test "$(printf '%s' "$tag" | jq -r '.object.type')" = commit
            test "$(printf '%s' "$tag" | jq -r '.object.sha')" = "$SOURCE_COMMIT"
          elif grep -Fq 'HTTP 404' "$RUNNER_TEMP/workspace-control-tag.err"; then
            gh api --method POST "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$release_tag" -f "sha=$SOURCE_COMMIT" >/dev/null
          else
            cat "$RUNNER_TEMP/workspace-control-tag.err" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/workspace-control-release-notes.md"
          cat > "$notes" <<EOF
          Official Node 24 native Studio Control release.

          Source: $REPOSITORY@$SOURCE_COMMIT ($SOURCE_REF)
          Component: cyrene-client-workspace-control
          Target: linux-ubuntu-24.04-x86_64-node-24 (native-binary)
          Protocol: cyrene.client.studio-control.v1
          Publisher workflow: $REPOSITORY/.github/workflows/workspace-control-release.yml
          EOF
          release_args=(--repo "$REPOSITORY" --verify-tag --title "Cyrene Client Workspace Control $SOURCE_COMMIT" --notes-file "$notes")
          if [[ "$CHANNEL" == preview ]]; then release_args+=(--prerelease); fi
          gh release create "$release_tag" "${release_args[@]}" \
            "$RELEASE_DIR/cyrene-client-workspace-control-$SOURCE_COMMIT.tar.gz" \
            "$RELEASE_DIR/cyrene-client-workspace-control.manifest.json" \
            "$RELEASE_DIR/component-release-index-v1.json" \
            "$RELEASE_DIR/cyrene-client-workspace-control-$SOURCE_COMMIT.tar.gz.attestation.jsonl" \
            "$RELEASE_DIR/cyrene-client-workspace-control.manifest.json.attestation.jsonl" \
            "$RELEASE_DIR/component-release-index-v1.json.attestation.jsonl"

      - name: Read back and verify the immutable release assets
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          release_tag="$CHANNEL-cyrene-client-workspace-control-$SOURCE_COMMIT"
          release_file="$RUNNER_TEMP/workspace-control-release.json"
          found=false
          for attempt in $(seq 1 12); do
            if gh api "repos/$REPOSITORY/releases/tags/$release_tag" > "$release_file" 2> "$RUNNER_TEMP/workspace-control-readback.err"; then
              found=true
              break
            fi
            if ! grep -Fq 'HTTP 404' "$RUNNER_TEMP/workspace-control-readback.err"; then
              cat "$RUNNER_TEMP/workspace-control-readback.err" >&2
              exit 1
            fi
            echo "Waiting for immutable release read-back ($attempt/12)"
            sleep 10
          done
          test "$found" = true
          python - "$release_file" "$release_tag" <<'PY'
          import json
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if release.get("tag_name") != sys.argv[2]:
              raise SystemExit("published native-Control release has the wrong immutable source tag")
          if release.get("immutable") is not True:
              raise SystemExit("GitHub did not mark the new native-Control release immutable")
          PY
          tag=$(gh api "repos/$REPOSITORY/git/ref/tags/$release_tag")
          test "$(printf '%s' "$tag" | jq -r '.object.type')" = commit
          test "$(printf '%s' "$tag" | jq -r '.object.sha')" = "$SOURCE_COMMIT"
          mkdir -p "$RUNNER_TEMP/workspace-control-readback"
          gh release download "$release_tag" --repo "$REPOSITORY" --dir "$RUNNER_TEMP/workspace-control-readback"
          for name in \
            "cyrene-client-workspace-control-$SOURCE_COMMIT.tar.gz" \
            cyrene-client-workspace-control.manifest.json \
            component-release-index-v1.json \
            "cyrene-client-workspace-control-$SOURCE_COMMIT.tar.gz.attestation.jsonl" \
            cyrene-client-workspace-control.manifest.json.attestation.jsonl \
            component-release-index-v1.json.attestation.jsonl; do
            cmp -- "$RELEASE_DIR/$name" "$RUNNER_TEMP/workspace-control-readback/$name"
          done
          python tooling/release/validate_native_control_release.py \
            --directory "$RUNNER_TEMP/workspace-control-readback" \
            --schema-directory "$SCHEMA_DIR" \
            --catalog "$SCHEMA_DIR/component-catalog-v2.json" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT"
          for subject in \
            "cyrene-client-workspace-control-$SOURCE_COMMIT.tar.gz" \
            cyrene-client-workspace-control.manifest.json \
            component-release-index-v1.json; do
            gh attestation verify "$RUNNER_TEMP/workspace-control-readback/$subject" \
              --bundle "$RUNNER_TEMP/workspace-control-readback/$subject.attestation.jsonl" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/workspace-control-release.yml" \
              --source-ref "$SOURCE_REF" \
              --source-digest "$SOURCE_COMMIT" \
              --predicate-type "$PREDICATE_TYPE"
          done
