server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    # The local Compose edge has no Easy Auth identity provider.
    location ^~ /api/workspace { default_type application/json; return 503 '{"code":"workspace_identity_not_configured"}'; }
    location ^~ /.auth { default_type application/json; return 503 '{"code":"workspace_identity_not_configured"}'; }
    location ~ ^/(studio-|api) {
        set $control_origin http://studio-control:5182;
        proxy_pass $control_origin$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
