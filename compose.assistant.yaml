# Optional model provider; never enable diagnostics in production by default.
# docker compose -f compose.yaml -f compose.assistant.yaml up -d --build
services:
  studio-control:
    environment:
      STUDIO_ASSISTANT_URL: ${STUDIO_ASSISTANT_URL:?Set the full HTTPS Chat Completions URL}
      STUDIO_ASSISTANT_MODEL: ${STUDIO_ASSISTANT_MODEL:?Set a tool-capable model}
      STUDIO_ASSISTANT_API_KEY_FILE: /run/secrets/studio_assistant_key
    secrets:
      - studio_assistant_key
secrets:
  studio_assistant_key:
    file: ${STUDIO_ASSISTANT_API_KEY_FILE:?Set the private model API key file path}
